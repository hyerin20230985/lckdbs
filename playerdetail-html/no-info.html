<head>

        .card h1 { margin:0 0 10px; font-size:1.6rem; }
        .card p { margin:0 0 18px; color:rgba(255,255,255,0.75); }
        .card a { display:inline-flex; gap:8px; align-items:center; padding:12px 18px; border-radius:14px;
