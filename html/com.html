<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 사이트</title>
    <link rel="stylesheet" href="../css/com.css">
    <!-- Quill.js 에디터 스타일시트 추가 -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/nav.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false,
                container: false,
            }
        }
    </script>
</head>

<body class="bg-black text-white relative min-h-screen flex flex-col">

    <!-- 프리미엄 배경 글로우 & 노이즈 효과 -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[0%] left-[-10%] w-[50%] h-[50%] bg-purple-900/40 rounded-full blur-[150px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-blue-900/30 rounded-full blur-[150px]"></div>
        <!-- 노이즈 텍스처 -->
        <div class="absolute inset-0 opacity-[0.04]"
            style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 800 800%22%3E%3Cfilter id=%22noise%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noise)%22/%3E%3C/svg%3E');">
        </div>
    </div>
    <header>
        <nav>
            <div class="nav-left">
                <a href="../index.html" class="logo">LCKDBS</a>
                <span class="nav-divider">|</span>
            </div>
            <div class="nav-scroll">
            <div class="nav-center">
                <a href="/html/player-new.html" class="nav-item">팀</a>
                <a href="/html/champion4.html" class="nav-item">챔피언</a>
                <a href="/html/schedule3.html" class="nav-item">일정</a>
                <a href="/html/mainstat.html" class="nav-item">스탯</a>
                <a href="/html/text_wiki.html" class="nav-item">분석</a>
                <a href="/html/com.html" class="nav-item">커뮤니티</a>
            </div>
            <div class="nav-right">
                <a href="#" class="nav-item live">LIVE <span class="live-dot"></span></a>
            </div>
            </div>
        </nav>
    </header>

    <div class="container relative z-10 flex-1">
        <!-- 게시물 목록 페이지 -->
        <main id="list-page" class="page">
            <div>
                <h1>게시판</h1>
            </div>
            <nav id="category-bar">
                <!-- 카테고리는 JS로 동적 생성 -->
            </nav>
            <div id="post-list-container">
                <!-- 게시물 목록은 JS로 동적 생성 -->
            </div>
            <div class="page-actions">
                <button id="write-post-btn">게시물 작성</button>
                <button id="manage-posts-btn">수정/삭제</button>
            </div>
        </main>

        <!-- 게시물 작성/수정 페이지 -->
        <section id="write-page" class="page hidden">
            <header>
                <h1 id="write-page-title">게시물 작성</h1>
            </header>
            <form id="write-form">
                <input type="hidden" id="post-id-input">
                <div class="form-group">
                    <label for="post-category">카테고리</label>
                    <select id="post-category" required>
                        <!-- 카테고리 옵션은 JS로 동적 생성 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="post-author">작성자</label>
                    <input type="text" id="post-author" placeholder="작성자명을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="post-title">제목</label>
                    <input type="text" id="post-title" placeholder="제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <!-- 기존 textarea를 Quill 에디터 컨테이너로 교체 -->
                    <div id="editor-container"></div>
                </div>
                <div class="form-group">
                    <label for="post-attachment">파일 첨부 (10MB 이하)</label>
                    <!-- accept 속성에 비디오 타입 추가 -->
                    <input type="file" id="post-attachment" accept="image/*,video/mp4,video/webm">
                    <div id="attachment-preview-container"></div>
                </div>
                <div class="form-group">
                    <label for="post-password">비밀번호</label>
                    <input type="password" id="post-password" placeholder="비밀번호를 입력하세요" required>
                </div>
                <div class="page-actions">
                    <button type="button" id="cancel-write-btn">취소</button>
                    <button type="submit" id="submit-post-btn">등록</button>
                </div>
            </form>
        </section>

        <!-- 게시물 상세 페이지 -->
        <section id="post-page" class="page hidden">
            <header>
                <button id="back-to-list-btn">목록으로</button>
            </header>
            <article id="post-detail-container">
                <!-- 게시물 상세 내용은 JS로 동적 생성 -->
            </article>
            <section id="comment-section">
                <h3>댓글</h3>
                <form id="comment-form">
                    <div class="comment-input-area">
                        <input type="text" id="comment-author" placeholder="작성자" required>
                        <input type="password" id="comment-password" placeholder="비밀번호" required>
                    </div>
                    <textarea id="comment-content" placeholder="댓글을 입력하세요..." required></textarea>
                    <button type="submit">댓글 작성</button>
                </form>
                <div id="comment-list">
                    <!-- 댓글 목록은 JS로 동적 생성 -->
                </div>
            </section>
        </section>
    </div>

    <!-- 수정/삭제용 모달 -->
    <div id="manage-modal" class="modal-wrapper hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>게시물 관리</h2>
            <p>작성자명과 비밀번호를 입력하세요.</p>
            <form id="manage-auth-form">
                <div class="form-group">
                    <input type="text" id="manage-author" placeholder="작성자명" required>
                </div>
                <div class="form-group">
                    <input type="password" id="manage-password" placeholder="비밀번호" required>
                </div>
                <button type="submit">확인</button>
            </form>
            <div id="user-post-list-container" class="hidden">
                <h3>내 게시물 목록</h3>
                <div id="user-post-list"></div>
                <div class="page-actions">
                    <button id="delete-selected-btn">선택 삭제</button>
                    <button id="edit-selected-btn">선택 수정</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 알림용 모달 -->
    <div id="alert-modal" class="modal-wrapper hidden">
        <div class="modal-content">
            <span class="close-alert-btn">&times;</span>
            <p id="alert-message"></p>
            <button class="close-alert-btn">확인</button>
        </div>
    </div>

    <!-- Quill.js 에디터 스크립트 추가 -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="../js/com.js"></script>

    <!-- 푸터 (Footer) 추가: 페이지 끝부분을 닫아주는 역할 -->
    <footer class="w-full bg-black/80 border-t border-white/10 mt-20 backdrop-blur-md relative z-10">
        <div class="max-w-[1600px] mx-auto px-8 py-10 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex flex-col gap-2 shadow-sm">
                <span class="text-2xl font-black text-white/80 tracking-wider">LCKDBS</span>
                <p class="text-sm text-gray-500">© 2025 LCKDBS. All rights reserved.</p>
            </div>

            <div class="flex gap-6 text-sm font-medium text-gray-400">
                <a href="#" class="text-gray-400 no-underline hover:text-purple-400 transition-colors">이용약관</a>
                <a href="#" class="text-gray-400 no-underline hover:text-purple-400 transition-colors">개인정보처리방침</a>
                <a href="#" class="text-gray-400 no-underline hover:text-purple-400 transition-colors">고객센터</a>
            </div>
        </div>
    </footer>
</body>

</html>
