<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 사이트</title>
    <link rel="stylesheet" href="/css/com.css">
</head>
<body>
    <div class="container">
        <!-- 게시물 목록 페이지 -->
        <main id="list-page" class="page">
            <header>
                <h1>게시판</h1>
            </header>
            <nav id="category-bar">
                <!-- 카테고리는 JS로 동적 생성 -->
            </nav>
            <div id="post-list-container">
                <!-- 게시물 목록은 JS로 동적 생성 -->
            </div>
            <div class="page-actions">
                <button id="write-post-btn">게시물 작성</button>
                <button id="manage-posts-btn">수정/삭제</button>
            </div>
        </main>

        <!-- 게시물 작성/수정 페이지 -->
        <section id="write-page" class="page hidden">
            <header>
                <h1 id="write-page-title">게시물 작성</h1>
            </header>
            <form id="write-form">
                <input type="hidden" id="post-id-input">
                <div class="form-group">
                    <label for="post-category">카테고리</label>
                    <select id="post-category" required>
                        <!-- 카테고리 옵션은 JS로 동적 생성 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="post-author">작성자</label>
                    <input type="text" id="post-author" placeholder="작성자명을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="post-title">제목</label>
                    <input type="text" id="post-title" placeholder="제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="post-content">내용</label>
                    <textarea id="post-content" rows="10" placeholder="내용을 입력하세요" required></textarea>
                </div>
                <div class="form-group">
                    <label for="post-attachment">파일 첨부</label>
                    <input type="file" id="post-attachment" accept="image/*">
                    <div id="image-preview-container"></div>
                </div>
                <div class="form-group">
                    <label for="post-password">비밀번호</label>
                    <input type="password" id="post-password" placeholder="비밀번호를 입력하세요" required>
                </div>
                <div class="page-actions">
                    <button type="button" id="cancel-write-btn">취소</button>
                    <button type="submit" id="submit-post-btn">등록</button>
                </div>
            </form>
        </section>

        <!-- 게시물 상세 페이지 -->
        <section id="post-page" class="page hidden">
            <header>
                <button id="back-to-list-btn">목록으로</button>
            </header>
            <article id="post-detail-container">
                <!-- 게시물 상세 내용은 JS로 동적 생성 -->
            </article>
            <section id="comment-section">
                <h3>댓글</h3>
                <form id="comment-form">
                    <div class="comment-input-area">
                        <input type="text" id="comment-author" placeholder="작성자" required>
                        <input type="password" id="comment-password" placeholder="비밀번호" required>
                    </div>
                    <textarea id="comment-content" placeholder="댓글을 입력하세요..." required></textarea>
                    <button type="submit">댓글 작성</button>
                </form>
                <div id="comment-list">
                    <!-- 댓글 목록은 JS로 동적 생성 -->
                </div>
            </section>
        </section>
    </div>

    <!-- 수정/삭제용 모달 -->
    <div id="manage-modal" class="modal-wrapper hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>게시물 관리</h2>
            <p>작성자명과 비밀번호를 입력하세요.</p>
            <form id="manage-auth-form">
                <input type="text" id="manage-author" placeholder="작성자명" required>
                <input type="password" id="manage-password" placeholder="비밀번호" required>
                <button type="submit">확인</button>
            </form>
            <div id="user-post-list-container" class="hidden">
                <h3>내 게시물 목록</h3>
                <div id="user-post-list"></div>
                <div class="page-actions">
                    <button id="delete-selected-btn">선택 삭제</button>
                    <button id="edit-selected-btn">선택 수정</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 알림용 모달 -->
    <div id="alert-modal" class="modal-wrapper hidden">
        <div class="modal-content">
            <span class="close-alert-btn">&times;</span>
            <p id="alert-message"></p>
            <button class="close-alert-btn">확인</button>
        </div>
    </div>

    <script src="/js/com.js"></script>
</body>
</html>
