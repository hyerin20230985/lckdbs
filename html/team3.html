<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/team3-styles.css">
    <title>LCK 팀 및 선수 목록</title>
</head>
<body>
    <div class="container">
        <!-- 팀 정보 영역 -->
        <section class="team-section">
            <div class="content-grid">
                <!-- 오른쪽: LCK 팀 목록 -->
                <div class="teams-section">
                    <h2 class="section-title" id="teamTitle">
                        2025 LCK 참가팀 
                        <button class="dropdown-button" id="dropdownButton">▼</button>
                        <div class="dropdown-list" id="yearDropdown">
                            <a href="#" data-year="2025">2025</a>
                            <a href="#" data-year="2024">2024</a>
                            <a href="#" data-year="2023">2023</a>
                            <a href="#" data-year="2022">2022</a>
                            <a href="#" data-year="2021">2021</a>
                            <a href="#" data-year="2020">2020</a>
                            <a href="#" data-year="2019">2019</a>
                            <a href="#" data-year="2018">2018</a>
                            <a href="#" data-year="2017">2017</a>
                            <a href="#" data-year="2016">2016</a>
                            <a href="#" data-year="2015">2015</a>
                            <a href="#" data-year="2014">2014</a>
                            <a href="#" data-year="2013">2013</a>
                            <a href="#" data-year="2012">2012</a>
                        </div>
                    </h2>
                    <ul class="teams-list active" id="teamsList">
                        <!-- 팀 목록이 여기에 동적으로 추가됩니다. -->
                    </ul>
                </div>
     
                <!-- 왼쪽: 선수 명단 -->
                <section class="players-section" style="display: none;">
                    <div class="team-header">
                        <img id="teamLogo" src="" alt="Team Logo" class="team-logo">
                        <h2 id="teamName" class="team-name"></h2>
                    </div>
                    <h2 class="section-title">선수 라인업</h2>
                    <div class="player-grid" id="playerGrid">
                        <!-- 선수 카드가 여기에 동적으로 추가됩니다. -->
                    </div>
                </section>
    </div>
</section>
</div>

    <script>
        
    </script>
    <script src="js/team3.js"></script>
</body>
</html>
