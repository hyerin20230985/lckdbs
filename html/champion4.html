            pointer-events: none;
        }

            transition: all 0.3s ease;
        }

        .hero-card-premium:hover {
            transform: translateY(-12px) scale(1.03);

        }

        .champion-card-premium {
            background: rgba(168,85,247,0.05);
            border: 1px solid rgba(168,85,247,0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;

        .champion-card-premium:hover {

                                style="animation-delay: ${index * 0.1}s; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(168,85,247,0.2);">
                                
                                <div class="aspect-[3/4] relative overflow-hidden">
                                    <div class="absolute inset-0 transition-all duration-700 group-hover:shadow-[inset_0_0_120px_rgba(168,85,247,0.4)]"></div>
                                    <img src="${championInfo.customUrl}" class="w-full h-full object-cover transition-all duration-700 group-hover:scale-110" />
                                    
                                    <div class="absolute top-4 left-4 right-4 flex justify-between items-start">
                                        <div class="bg-black/60 backdrop-blur-md px-3 py-1 rounded-full border border-white/20">
                                            <span class="text-xs font-bold text-white">${championInfo.lane}</span>
                                        </div>
                                    </div>
                                    
                                    <div class="absolute bottom-0 left-0 right-0 p-4 xl:p-6 bg-gradient-to-t from-black/95 via-black/70 to-transparent">
                                        <h3 class="text-xl xl:text-2xl font-black text-white mb-1 truncate" style="text-shadow: 0 2px 20px rgba(0,0,0,0.8);">${champion.name}</h3>
                                        <p class="text-xs xl:text-sm text-gray-300 mb-3 truncate">${champion.title}</p>
                                        <div class="w-full h-0.5 bg-purple-400 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                    </div>
                                </div>
                                
                                <div class="p-4 xl:p-6 bg-gradient-to-br from-black/60 to-black/40 backdrop-blur-2xl">
                                    ${match ? `
                                    <div class="space-y-3">
                                        <div class="flex items-center justify-between min-w-0">
                                            <div class="flex items-center space-x-2 truncate">
                                                <div class="w-2 h-2 rounded-full bg-purple-400 shrink-0"></div>
                                                <span class="font-bold text-white text-xs xl:text-sm truncate">${match.player.name}</span>
                                            </div>
                                            <span class="font-bold text-[10px] xl:text-xs px-2 py-1 rounded-full shrink-0 ml-1 ${match.result === 'win' ? 'bg-green-500/20 text-green-400 border border-green-400/30' : 'bg-red-500/20 text-red-400 border border-red-400/30'}">
                                                ${match.result === 'win' ? 'WIN' : 'LOSS'}
                                            </span>
                                        </div>
                                        <div class="flex justify-between items-center text-gray-300 min-w-0">
                                            <span class="font-mono text-base xl:text-lg font-bold text-white shrink-0">${match.kda}</span>
                                            <span class="text-[10px] xl:text-xs text-gray-400 truncate ml-2">${match.matchInfo}</span>
                                        </div>
                                        <div class="flex flex-wrap gap-1 xl:gap-1.5 justify-start">
                                            ${match.items.slice(0, 6).map(item => `
                                                <div class="w-6 h-6 xl:w-8 xl:h-8 shrink-0 bg-white/10 rounded overflow-hidden border border-white/20 hover:border-purple-400/50 transition-colors duration-300">
                                                    <img src="${itemURL(item)}" class="w-full h-full object-cover" />
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                    ` : `
                                    <div class="text-center py-6">
                                        <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-gray-800/50 flex items-center justify-center">
                                            <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                            </svg>
                                        </div>
                                        <p class="text-sm text-gray-500">선수 전적 정보 없음</p>
                                    </div>
                                    `}
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            
            const shouldExpand = state.isAllExpanded || state.searchTerm;
            const showMoreButtonHTML = `
                <div class="flex justify-center mt-12">
                    <button class="show-all-btn group relative px-12 py-4 rounded-2xl purple-accent backdrop-blur-md border text-white text-lg font-bold hover:bg-purple-600/20 transition-all duration-500 hover:scale-105 hover:-translate-y-1 shadow-2xl">
                        <span class="relative z-10 flex items-center space-x-3">
                            <span>${shouldExpand && !state.searchTerm ? '간략히 보기' : '전체 챔피언 보기'}</span>
                            <svg class="w-5 h-5 transition-transform duration-300 ${shouldExpand ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </span>
                    </button>
                </div>
            `;
            
            const mainContentHTML = state.searchTerm ? '' : heroesHTML;
            const buttonHTML = state.searchTerm ? '' : showMoreButtonHTML;
            
            DOMElements.tierContentContainer.innerHTML = mainContentHTML + `<div id="all-tier-list-container" class="mt-16 transition-all duration-700" style="max-height: ${shouldExpand ? '5000px' : '0px'}; overflow:hidden;">${tierRowsHTML}</div>` + buttonHTML;
            
            if(shouldExpand) {
                 setTimeout(() => { document.querySelectorAll('.tier-section').forEach(el => { el.classList.remove('opacity-0', 'translate-y-[-50px]'); }); }, 10);
            }
        }


        function renderLaneSpecificView() {
            const laneTiers = tierListData[state.selectedLane] || {};
            let filteredTiers = laneTiers;
             if (state.searchTerm) {
                filteredTiers = {};
                for (const tier in laneTiers) {
                    const filteredChampions = laneTiers[tier].filter(id => 
                        championsData[id] && championsData[id].name.toLowerCase().includes(state.searchTerm.toLowerCase())
                    );
                    if (filteredChampions.length > 0) filteredTiers[tier] = filteredChampions;
                }
            }
            
            const tierRowsHTML = Object.entries(filteredTiers).map(([tier, champions], index) => `
                <div class="tier-row mb-10 opacity-0 translate-x-[-50px]" style="transition: opacity 0.5s ${index * 0.15}s ease-out, transform 0.5s ${index * 0.15}s ease-out;">
                    <h2 class="text-5xl md:text-6xl lg:text-7xl font-black text-white/20 tracking-widest relative -left-4 mb-2">TIER ${tier}</h2>
                    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-8 xl:grid-cols-10 gap-2">
                        ${champions.map((id, cardIndex) => {
                            const champion = championsData[id];
                            if (!champion) return ''; 

                            return `
                            <div class="champion-card champion-card-premium w-full aspect-square rounded-lg cursor-pointer group relative overflow-hidden transform transition-all duration-500 hover:scale-110 hover:-translate-y-2" 
                                data-champion-id="${id}" 
                                style="animation-delay: ${cardIndex * 0.05}s; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);">
                                <div class="glow-effect absolute inset-0 rounded-lg transition-all duration-500 z-10 opacity-0"></div>
                                <img src="${champion.avatarUrl}" alt="${champion.name}" class="relative w-full h-full object-cover transition-all duration-500 group-hover:scale-110 z-0"/>
                                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex items-end justify-center z-5">
                                    <div class="text-center pb-2 transform translate-y-4 group-hover:translate-y-0 transition-all duration-500">
                                        <p class="text-xs text-white font-bold mb-1 opacity-0 group-hover:opacity-100 transition-opacity duration-300">${champion.name}</p>
                                        <div class="w-6 h-0.5 bg-purple-400 mx-auto opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                    </div>
                                </div>
                            </div>
                        `}).join('')}
                    </div>
                </div>`).join('');
                
            DOMElements.tierContentContainer.innerHTML = tierRowsHTML;
            setTimeout(() => { document.querySelectorAll('.tier-row').forEach(el => { el.classList.remove('opacity-0', 'translate-x-[-50px]'); }); }, 10);
        }

        function renderBackground() {
            let firstChampId = 'Aatrox'; 
            let championPool = [];

            if (state.selectedLane !== 'ALL') {
                const laneTiers = tierListData[state.selectedLane];
                championPool = Object.values(laneTiers).flat(); 
            } else {
                championPool = Object.keys(championsData);
            }

            if (championPool.length > 0) {
                const randomIndex = Math.floor(Math.random() * championPool.length);
                firstChampId = championPool[randomIndex];
            }
            
            const bgUrl = championsData[firstChampId] ? championsData[firstChampId].splashUrl : championsData['Aatrox'].splashUrl;

            const oldBg = DOMElements.backgroundContainer.querySelector('.bg-image');
            if(oldBg) { oldBg.style.opacity = '0'; setTimeout(() => oldBg.remove(), 1500); }
            const newBg = document.createElement('div');
            newBg.className = 'bg-image absolute inset-0 transition-opacity duration-[1.5s] ease-in-out opacity-0';
            newBg.innerHTML = `<img src="${bgUrl}" alt="background" class="w-full h-full object-cover scale-110" /><div class="absolute inset-0 bg-black/60 backdrop-blur-md"></div><div class="absolute inset-0 bg-gradient-to-r from-black via-black/50 to-transparent"></div>`;
            DOMElements.backgroundContainer.appendChild(newBg);
            setTimeout(() => newBg.style.opacity = '1', 10);
        }

        function renderStatsPanel() {
    if (!state.selectedChampionId) { DOMElements.panelContainer.innerHTML = ''; return; }
    
    const champion = championsData[state.selectedChampionId];
    if (!champion) return;

    const matches = matchHistoryDataByChampion[state.selectedChampionId] || [];
    
    const panelHTML = `
        <div id="stats-panel" class="fixed bottom-0 lg:top-1/2 left-0 lg:left-auto lg:right-6 lg:-translate-y-1/2 w-full lg:w-[440px] h-auto max-h-[85vh] bg-black/85 backdrop-blur-3xl border border-white/10 rounded-t-3xl lg:rounded-3xl flex flex-col shadow-2xl transition-transform duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] translate-y-[150%] lg:translate-x-[150%] lg:translate-y-0 z-50 overflow-hidden">
            <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mt-3 mb-1 lg:hidden shrink-0"></div>
            <div class="relative p-6 pt-2 lg:pt-6 pb-4 border-b border-white/10 bg-gradient-to-b from-white/5 to-transparent shrink-0">
                 <button class="close-btn absolute top-5 right-5 text-gray-400 hover:text-white transition-colors p-1 hover:bg-white/10 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                
                <div class="flex flex-col items-center gap-4 pt-2">
                    <img src="${champion.avatarUrl}" class="w-24 h-24 rounded-full border-4 border-purple-500/20 shadow-[0_0_20px_rgba(168,85,247,0.4)]" />
                    <div class="text-center">
                        <h2 class="text-3xl font-black text-white tracking-wider mb-1">${champion.name}</h2>
                        <p class="text-purple-400 font-medium text-base tracking-wide">${champion.title}</p>
                    </div>
                </div>
            </div>

            <div class="overflow-y-auto no-scrollbar p-6 pt-4">
                <div class="flex items-center mb-5 opacity-80">
                    <div class="h-px flex-grow bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
                    <span class="px-3 text-xs font-bold text-gray-400 uppercase tracking-[0.2em]">Recent Matches</span>
                    <div class="h-px flex-grow bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
                </div>
                
                <div class="flex flex-col gap-3">
                    ${matches.length > 0 ? matches.map(match => `
                        <div class="bg-white/5 p-4 rounded-xl border border-white/5 hover:border-purple-500/30 transition-colors group hover:bg-white/10">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    <div class="w-2 h-2 rounded-full ${match.result === 'win' ? 'bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.6)]' : 'bg-red-400'}"></div>
                                    <span class="font-bold text-gray-200 text-sm">${match.player.name}</span>
                                </div>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-white/10 text-gray-500 group-hover:bg-white/20 transition-colors">${match.matchInfo.split('vs')[0]}</span>
                            </div>
                            
                            <div class="flex justify-between items-end mb-3">
                                <span class="font-mono text-xl font-bold text-white tracking-tight group-hover:text-purple-200 transition-colors">${match.kda}</span>
                                <span class="text-xs font-bold ${match.result === 'win' ? 'text-green-400' : 'text-red-400'}">${match.result === 'win' ? 'VICTORY' : 'DEFEAT'}</span>
                            </div>
                            
                            <div class="flex gap-1.5">
                                ${match.items.map(item => `
                                    <div class="w-9 h-9 bg-black/40 rounded overflow-hidden ring-1 ring-white/5 group-hover:ring-white/20 transition-all">
                                        <img src="${itemURL(item)}" class="w-full h-full object-cover" />
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('') : '<div class="text-center text-sm text-gray-600 py-10 border border-dashed border-white/5 rounded-xl">전적 데이터가 없습니다.</div>'}
                </div>
            </div>
        </div>`;
        
    DOMElements.panelContainer.innerHTML = panelHTML;
    
    setTimeout(() => { 
        const panel = document.getElementById('stats-panel'); 
        if(panel) panel.classList.remove('translate-y-[150%]', 'lg:translate-x-[150%]'); 
    }, 50);
}
        // --- 이벤트 핸들러 ---
        function handleLaneSelect(event) { const button = event.target.closest('.lane-button'); if (button) { state.selectedLane = button.dataset.lane; state.isAllExpanded = false; DOMElements.searchInput.value = ''; state.searchTerm = ''; renderLaneFilters(); renderTierList(); renderBackground(); } }
        function handleSearchInput(event) { state.searchTerm = event.target.value; renderTierList(); }
        function handleSearchSubmit(event) { event.preventDefault(); if (state.searchTerm.trim()) { renderTierList(); } }
        
        function handleContentClick(event) {
            const championCard = event.target.closest('.champion-card');
            if (championCard) { 
                state.selectedChampionId = championCard.dataset.championId; 

                // 데스크탑에서만 오른쪽 여백을 줘서 컨텐츠를 밀어냅니다.
                if (window.innerWidth >= 1024) {
                    DOMElements.mainContent.style.marginRight = '450px';
                }
                
                renderStatsPanel(); 
            }

            const showAllBtn = event.target.closest('.show-all-btn');
            if (showAllBtn) { 
                state.isAllExpanded = !state.isAllExpanded; 
                renderTierList(); 
            }
        }
        
        function handlePanelClose(event) {
            // "열기" 버튼(champion-card) 클릭 시에는 닫기 동작 무시
            const isClickOnCard = event.target.closest('.champion-card');
            if (isClickOnCard) return;

            // 닫기 버튼 혹은 패널 외부 클릭 시
            if (event.target.closest('.close-btn') || !event.target.closest('#stats-panel')) {
                const panel = document.getElementById('stats-panel');
                
                // 패널이 열려있을 때만 실행
                if (panel && state.selectedChampionId) {
                    if (window.innerWidth >= 1024) {
                        panel.classList.add('lg:translate-x-[150%]'); // 패널 퇴장 애니메이션
                    } else {
                        panel.classList.add('translate-y-[150%]');
                    }

                    // 여백을 제거하여 원래 너비로 복귀
                    DOMElements.mainContent.style.marginRight = '0px';
                    
                    state.selectedChampionId = null;

                    setTimeout(() => {
                        DOMElements.panelContainer.innerHTML = '';
                    }, 700); // transition 시간과 맞춤
                }
            }
        }

        // --- 초기화 함수 ---
        function init() {
            renderLaneFilters();
            renderTierList();
            renderBackground();

            DOMElements.laneFiltersContainer.addEventListener('click', handleLaneSelect);
            DOMElements.searchInput.addEventListener('input', handleSearchInput);
            DOMElements.searchIconBtn.addEventListener('click', handleSearchSubmit);
            DOMElements.tierContentContainer.addEventListener('click', handleContentClick);
            
            // 패널 닫기 이벤트 (전역 클릭 감지)
            document.addEventListener('click', handlePanelClose); 

            // 진입 애니메이션 (사이드바만)
            setTimeout(() => {
                DOMElements.sidebar.style.transform = 'translateX(0)';
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
