<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선수 스탯 비교</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../css/mainstat.css">
    <link rel="stylesheet" href="../css/nav.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false,
                container: false,
            }
        }
    </script>
</head>

<body class="bg-black text-white relative min-h-screen flex flex-col">

    <!-- 프리미엄 배경 글로우 & 노이즈 효과 -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[0%] left-[-10%] w-[50%] h-[50%] bg-purple-900/40 rounded-full blur-[150px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-blue-900/30 rounded-full blur-[150px]"></div>
        <!-- 노이즈 텍스처 -->
        <div class="absolute inset-0 opacity-[0.04]"
            style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 800 800%22%3E%3Cfilter id=%22noise%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noise)%22/%3E%3C/svg%3E');">
        </div>
    </div>

    <header>
        <nav>
            <div class="nav-left">
                <a href="../index.html" class="logo">LCKDBS</a>
                <span class="nav-divider">|</span>
            </div>
            <div class="nav-center">
                <a href="/html/player-new.html" class="nav-item">팀</a>
                <a href="/html/champion4.html" class="nav-item">챔피언</a>
                <a href="/html/schedule3.html" class="nav-item">일정</a>
                <a href="/html/mainstat.html" class="nav-item">스탯</a>
                <a href="/html/text_wiki.html" class="nav-item">분석</a>
                <a href="/html/com.html" class="nav-item">커뮤니티</a>
            </div>
            <div class="nav-right">
                <a href="#" class="nav-item live">LIVE <span class="live-dot"></span></a>
            </div>
        </nav>
    </header>

    <div class="container relative z-10 flex-1">
        <div>
            <h1>프로스탯 / 선수 비교</h1>
            <div class="filters">
                <select id="league-select">
                    <option value="LCK">LCK</option>
                </select>
                <select id="year-select">
                    <option value="2025">2025</option>
                </select>
                <select id="round-select">
                    <option value="Rounds 1-2">Rounds 1-2</option>
                </select>
            </div>
        </div>

        <nav class="view-tabs">
            <button id="tab-btn-comparison" class="tab-button active" data-view="view-comparison">선수 비교</button>
            <button id="tab-btn-single" class="tab-button" data-view="view-single">단일 선수 조회</button>
        </nav>

        <main>
            <div id="view-comparison" class="view-content active">
                <div class="player-cards-container comparison-layout">
                    <div id="player1-card" class="player-card-wrapper"></div>
                    <div class="radar-chart-wrapper comparison-radar">
                        <canvas id="radarChartComparison"></canvas>
                    </div>
                    <div id="player2-card" class="player-card-wrapper"></div>
                </div>

                <div class="comparison-selector">
                    <div class="player-select-container">
                        <div class="player-filters">
                            <select id="team-filter1" class="filter-select">
                                <option value="all">모든 팀</option>
                            </select>
                            <select id="position-filter1" class="filter-select">
                                <option value="all">모든 포지션</option>
                            </select>
                        </div>
                        <select id="player1-select" class="player-select">
                            <option value="">선수 1 선택</option>
                        </select>
                    </div>
                    <div class="vs">VS</div>
                    <div class="player-select-container">
                        <div class="player-filters">
                            <select id="team-filter2" class="filter-select">
                                <option value="all">모든 팀</option>
                            </select>
                            <select id="position-filter2" class="filter-select">
                                <option value="all">모든 포지션</option>
                            </select>
                        </div>
                        <select id="player2-select" class="player-select">
                            <option value="">선수 2 선택</option>
                        </select>
                    </div>
                </div>

                <div id="win-prediction-container"></div>
                <div id="stats-container-comparison"></div>
            </div>

            <div id="view-single" class="view-content">
                <div class="single-player-selector">
                    <div class="player-filters">
                        <select id="team-filter-single" class="filter-select">
                            <option value="all">모든 팀</option>
                        </select>
                        <select id="position-filter-single" class="filter-select">
                            <option value="all">모든 포지션</option>
                        </select>
                    </div>
                    <select id="player-select-single" class="player-select">
                        <option value="">선수를 선택하세요</option>
                    </select>
                </div>

                <div class="player-cards-container single-layout">
                    <div id="player-card-single" class="player-card-wrapper"></div>
                    <div class="radar-chart-wrapper single-radar">
                        <canvas id="radarChartSingle"></canvas>
                    </div>
                </div>

                <div id="stats-container-single"></div>
            </div>
        </main>
    </div>

    <script src="../js/mainstat.js"></script>

    <!-- 푸터 (Footer) 추가: 페이지 끝부분을 닫아주는 역할 -->
    <footer class="w-full bg-black/80 border-t border-white/10 mt-20 backdrop-blur-md relative z-10">
        <div class="max-w-[1600px] mx-auto px-8 py-10 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex flex-col gap-2 shadow-sm">
                <span class="text-2xl font-black text-white/80 tracking-wider">LCKDBS</span>
                <p class="text-sm text-gray-500">© 2025 LCKDBS. All rights reserved.</p>
            </div>

            <div class="flex gap-6 text-sm font-medium text-gray-400">
                <a href="#" class="text-gray-400 no-underline hover:text-purple-400 transition-colors">이용약관</a>
                <a href="#" class="text-gray-400 no-underline hover:text-purple-400 transition-colors">개인정보처리방침</a>
                <a href="#" class="text-gray-400 no-underline hover:text-purple-400 transition-colors">고객센터</a>
            </div>
        </div>
    </footer>
</body>

</html>
