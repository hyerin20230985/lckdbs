<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Guide Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/text_wiki-styles.css">
    <style>
        /* ============================================
           nav.css 충돌 방지: 사이드바/article header 리셋
           nav.css의 전역 nav{} 셀렉터가 사이드바를
           망가뜨리지 않도록 명시적으로 무력화합니다.
        ============================================ */
        aside {
            /* aside 내부의 nav.css 영향 완전 차단 */
            min-width: 0 !important;
        }

        #strategy-list {
            /* 사이드바 목록: nav.css를 완전히 덮어씀 */
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 1rem !important;
            display: block !important;
            justify-content: unset !important;
            min-width: 0 !important;
            box-shadow: none !important;
            gap: 0 !important;
            flex-wrap: unset !important;
        }

        /* article 내부의 header(detail card)가
           nav.css의 header{} 셀렉터에 영향받지 않도록 */
        article header,
        article .detail-header {
            position: static !important;
            top: unset !important;
            left: unset !important;
            transform: none !important;
            width: auto !important;
            max-width: none !important;
            z-index: auto !important;
        }

        /* 네비 헤더 위치: 사이드바(320px) 우측 메인 영역 중앙 */
        #main-header {
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
        }

        @media (min-width: 1024px) {
            #main-header {
                left: calc(320px + (100vw - 320px) / 2);
            }
        }

        /* 모바일 사이드바 활성화 상태 */
        aside.mobile-active {
            display: flex !important;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 320px;
            z-index: 300;
            animation: slide-in 0.3s ease-out;
        }

        @keyframes slide-in {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        /* 오버레이 */
        #sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 250;
        }
        #sidebar-overlay.active {
            display: block;
        }
    </style>
</head>

<body
    class="bg-black text-gray-200 h-screen flex overflow-x-hidden relative selection:bg-purple-500/40 font-sans antialiased">

    <!-- 전역 네비게이션 바 추가 -->
    <header id="main-header">
        <nav>
            <div class="nav-left">
                <button id="mobile-sidebar-toggle" class="lg:hidden mr-2 p-2 hover:bg-white/10 rounded-lg transition-colors">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
                <a href="../index.html" class="logo">LCKDBS</a>
                <span class="nav-divider">|</span>
            </div>
            <div class="nav-center">
                <a href="/html/player-new.html" class="nav-item">팀</a>
                <a href="/html/champion4.html" class="nav-item">챔피언</a>
                <a href="/html/schedule3.html" class="nav-item">일정</a>
                <a href="/html/mainstat.html" class="nav-item">스탯</a>
                <a href="/html/text_wiki.html" class="nav-item">분석</a>
                <a href="/html/com.html" class="nav-item">커뮤니티</a>
            </div>
            <div class="nav-right">
                <a href="#" class="nav-item live">LIVE <span class="live-dot"></span></a>
            </div>
        </nav>
    </header>

    <!-- 프리미엄 배경 글로우 & 노이즈 효과 -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[0%] left-[-10%] w-[50%] h-[50%] bg-purple-900/40 rounded-full blur-[150px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-blue-900/30 rounded-full blur-[150px]"></div>
        <!-- 노이즈 텍스처 -->
        <div class="absolute inset-0 opacity-[0.04]"
            style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 800 800%22%3E%3Cfilter id=%22noise%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noise)%22/%3E%3C/svg%3E');">
        </div>
    </div>

    <!-- 사이드바 오버레이 -->
    <div id="sidebar-overlay"></div>

    <aside
        class="hidden lg:flex w-[320px] shrink-0 bg-[#10121A]/80 backdrop-blur-3xl border-r border-purple-500/10 flex-col z-20 shadow-[10px_0_30px_rgba(0,0,0,0.5)] relative"
        style="min-width:320px; overflow:hidden;">
        <div class="glass-noise"></div>

        <div class="p-6 border-b border-white/5 relative z-10">
            <a href="#" onclick="location.reload(); return false;"
                class="flex items-center gap-3 group w-max cursor-pointer mb-2">
                <div
                    class="relative flex shrink-0 items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-[#1A1C29] to-[#0B0D14] border border-purple-500/30 group-hover:border-purple-400/80 group-hover:shadow-[0_0_15px_rgba(168,85,247,0.3)] transition-all duration-300">
                    <span
                        class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white to-purple-300">L</span>
                </div>
                <div class="flex flex-col">
                    <h1
                        class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400 tracking-tight group-hover:from-purple-300 group-hover:to-indigo-300 transition-all leading-none">
                        LCKDBS
                    </h1>
                    <span class="text-[10px] text-purple-200/40 font-bold tracking-widest uppercase mt-0.5">Wiki &
                        Guide</span>
                </div>
            </a>
            <p class="text-[13px] text-purple-200/50 mt-1 font-medium tracking-wide">소환사의 협곡 전략 & 메타 백과</p>
        </div>

        <div class="p-4 border-b border-white/5 relative z-10 bg-black/20">
            <div class="relative group">
                <div
                    class="absolute -inset-0.5 bg-gradient-to-r from-purple-500 to-indigo-500 rounded-lg blur opacity-0 group-focus-within:opacity-40 transition duration-500">
                </div>
                <input type="text" id="search-input" placeholder="무엇이 궁금하신가요?"
                    class="relative w-full bg-[#0B0D14] text-sm text-white px-4 py-2.5 rounded-lg border border-gray-700/50 focus:outline-none focus:border-purple-500/50 transition-all placeholder-gray-600">
            </div>
        </div>

        <div id="strategy-list" class="flex-grow overflow-y-auto custom-scrollbar p-4 space-y-1 relative z-10">
            <div class="text-center text-sm text-gray-500 mt-10 animate-pulse">데이터 로딩 중...</div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative z-10 overflow-hidden">
        <div id="content-area" class="flex-1 overflow-y-auto custom-scrollbar relative scroll-smooth flex flex-col">

            <div class="flex-1 p-4 pt-24 md:p-12 md:pt-28 lg:px-24 lg:py-16 lg:pt-32">
                <div id="empty-state"
                    class="flex flex-col items-center justify-center min-h-[60vh] text-center select-none pt-12">
                    <div class="text-8xl mb-8 opacity-10 filter drop-shadow-[0_0_30px_rgba(168,85,247,0.5)]">📖</div>
                    <h2 class="text-3xl font-extrabold text-gray-400 tracking-widest uppercase">지식의 샘</h2>
                    <p class="text-gray-500 mt-4 text-lg">좌측 메뉴에서 알고 싶은 전략이나 밈을 선택하세요.</p>
                </div>

                <article id="strategy-detail" class="hidden max-w-5xl mx-auto w-full pb-10">

                    <div
                        class="detail-header premium-card rounded-[2rem] p-10 md:p-12 mb-12 relative overflow-hidden group animate-fade-in-up">
                        <div class="glass-noise"></div>
                        <div
                            class="absolute -top-20 -right-20 w-64 h-64 bg-purple-500/10 rounded-full blur-3xl group-hover:bg-purple-500/20 transition-all duration-700">
                        </div>

                        <div class="relative z-10">
                            <div class="flex items-center gap-4 mb-6">
                                <span id="detail-category"
                                    class="text-sm font-black tracking-widest text-purple-300 bg-purple-500/10 border border-purple-500/20 px-5 py-2 rounded-full">CATEGORY</span>
                                <span id="detail-difficulty"
                                    class="text-sm font-bold px-4 py-2 rounded-full">DIFFICULTY</span>
                            </div>
                            <h1 id="detail-title"
                                class="text-3xl md:text-5xl lg:text-6xl font-extrabold text-white mb-6 tracking-tight drop-shadow-lg leading-tight">
                                Title</h1>
                            <p id="detail-summary"
                                class="text-lg md:text-xl lg:text-2xl text-purple-200/80 font-medium leading-relaxed">Summary</p>
                        </div>
                    </div>

                    <div id="detail-image-container" class="hidden mb-12 animate-fade-in-up"
                        style="animation-delay: 0.1s;"></div>

                    <div class="flex flex-col gap-10">

                        <section
                            class="bg-[#161822]/80 border border-white/5 rounded-2xl p-0 md:p-0 backdrop-blur-sm relative overflow-hidden animate-fade-in-up"
                            style="animation-delay: 0.2s;">
                            <div class="absolute left-0 top-0 w-1.5 h-full bg-purple-500/50"></div>

                            <div class="collapsible-section">
                                <button class="collapsible-toggle w-full text-left"
                                    onclick="this.classList.toggle('active'); document.getElementById('detail-description').classList.toggle('active'); return false;">
                                    <span class="flex items-center gap-2">
                                        <span class="text-3xl opacity-90 drop-shadow-md">📝</span> Description
                                    </span>
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>
                                <div id="detail-description"
                                    class="collapsible-content space-y-6 text-gray-200 leading-[1.8] text-lg font-light">
                                </div>
                            </div>
                        </section>

                        <section class="hidden animate-fade-in-up" style="animation-delay: 0.3s;">
                            <h3 class="text-base font-black text-gray-400 tracking-widest uppercase mb-6"
                                id="steps-title"></h3>
                            <div id="detail-steps" class="space-y-4"></div>
                        </section>

                        <section class="hidden animate-fade-in-up" style="animation-delay: 0.4s;">
                            <h3 class="text-base font-black text-gray-400 tracking-widest uppercase mb-6"
                                id="counter-title"></h3>
                            <div id="detail-counter"></div>
                        </section>
                </article>
            </div>

            <!-- 푸터 (Footer) 추가: 페이지 끝부분을 닫아주는 역할 -->
            <footer class="w-full bg-black/80 border-t border-white/10 mt-auto backdrop-blur-md shrink-0">
                <div
                    class="max-w-[1600px] mx-auto px-8 py-10 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div class="flex flex-col gap-2 shadow-sm">
                        <span class="text-2xl font-black text-white/80 tracking-wider">LCKDBS</span>
                        <p class="text-sm text-gray-500">© 2025 LCKDBS. All rights reserved.</p>
                    </div>

                    <div class="flex gap-6 text-sm font-medium text-gray-400">
                        <a href="#" class="hover:text-purple-400 transition-colors">이용약관</a>
                        <a href="#" class="hover:text-purple-400 transition-colors">개인정보처리방침</a>
                        <a href="#" class="hover:text-purple-400 transition-colors">고객센터</a>
                    </div>
                </div>
            </footer>
        </div>
    </main>

    <script src="../js/wiki.js"></script>
</body>

</html>
